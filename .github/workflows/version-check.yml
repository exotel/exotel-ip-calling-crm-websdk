name: Version check

# Fails a PR if its package.json version is already on npm or already tagged.
# Published versions are never overwritten, so each release needs a new version.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  version:
    name: Check version is new
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm pack runs the prepare script, which needs the dev dependencies (tsc).
      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Fail if version already published or tagged
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          git fetch -q origin "$BASE_REF"
          BASE_VERSION=$(git show "origin/$BASE_REF:package.json" \
            | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).version))')

          # Without a version bump, the PR may only change files outside the npm package.
          if [ "$VERSION" = "$BASE_VERSION" ]; then
            if ! bash .github/scripts/publishable-changes.sh "origin/$BASE_REF" HEAD; then
              echo "::error::Files in the npm package changed, but the version is still $VERSION. Bump the version in package.json."
              exit 1
            fi
            echo "Version unchanged ($VERSION) and no packaged files changed. OK."
            exit 0
          fi

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already on npm. Bump the version in package.json."
            exit 1
          fi

          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "::error::Tag v$VERSION already exists. Bump the version in package.json."
            exit 1
          fi

          echo "$NAME@$VERSION is new. OK."
