name: Release

# Run manually after the staged version has been approved on npm.
# Checks that the version is live on npm, then creates the tag and the
# GitHub release with the browser bundle attached.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.4.0 (must match package.json)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Tag and GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify version matches package.json and is on npm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json is $PKG_VERSION, not $VERSION. Release from the matching main commit."
            exit 1
          fi
          if ! npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is not on npm. Approve the staged publish first."
            exit 1
          fi

      - name: Create and push tag
        env:
          TAG: v${{ inputs.version }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::Tag $TAG already exists. Refusing to move it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build:all

      - name: Zip bundle (target/)
        run: |
          cd target
          zip -r ../crm-websdk-target.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
          files: |
            crm-websdk-target.zip
            target/crmBundle.js
            target/crmBundle.js.LICENSE.txt
            target/*.wav
